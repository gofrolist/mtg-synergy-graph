name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Both jobs execute third-party code (package build hooks via uv sync,
# pytest plugin entry points), so: read-only token, declared in-file
# rather than inherited from the mutable repo default, and no
# checkout credentials left in .git/config for that code to read.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      # --locked: fail on pyproject/uv.lock drift instead of silently
      # re-resolving to fresh (unreviewed) versions.
      - run: uv sync --locked
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run ruff format --check src/ tests/ scripts/
      - run: uv run pyright src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest tests/ -q --cov-report=term-missing
