name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Both jobs execute third-party code (package build hooks via uv sync,
# pytest plugin entry points), so: read-only token, declared in-file
# rather than inherited from the mutable repo default, and no
# checkout credentials left in .git/config for that code to read.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # --locked: fail on pyproject/uv.lock drift instead of silently
      # re-resolving to fresh (unreviewed) versions.
      - run: uv sync --locked
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run ruff format --check src/ tests/ scripts/
      - run: uv run pyright src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest tests/ -q --cov-report=term-missing
