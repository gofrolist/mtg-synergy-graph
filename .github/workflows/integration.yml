name: Integration tests

# Integration tests (marker `integration`) need real data that isn't
# checked in: the full `data/synergy.db` (~76 MB) built from the Forge
# cardsfolder, and optionally `data/tags.db` (custom Scryfall-shaped DB).
#
# Because those artefacts aren't reproducible in CI without an external
# pipeline, this workflow is MANUAL-DISPATCH ONLY. It is not wired into
# pull-request or push triggers. Run it from the Actions tab before a
# release once you have a working strategy for shipping the data to
# the runner (see DATA SOURCE below).
#
# DATA SOURCE (pick one, maintainer TODO):
#   (a) GitHub Release asset — upload synergy.db / tags.db to a release
#       (e.g. tag `data-latest`) and download via `gh release`.
#   (b) Git LFS — track `data/*.db` with LFS; workflow checks out with
#       lfs: true.
#   (c) S3 / GCS — add a step with cloud CLI + repo secret for creds.
#   (d) Self-hosted runner — mount the data at a known path.
#
# Until one is chosen, this workflow only exercises the Forge
# cardsfolder tests (test_ports.py + test_importer.py cardsfolder
# cases); tests that need synergy.db will skip via their skipif
# fallback, and the workflow reports skipped counts for visibility.

on:
  workflow_dispatch:
    inputs:
      forge_ref:
        description: "Card-Forge/forge ref to sparse-checkout (tag/sha/branch)"
        required: false
        default: "master"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Sparse-checkout Forge cardsfolder
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Card-Forge/forge
          # `inputs.forge_ref` is user-provided (workflow_dispatch) and
          # consumed only as a structured action input (never expanded
          # into a shell command), so no command-injection surface.
          ref: ${{ inputs.forge_ref }}
          path: data/forge
          sparse-checkout: forge-gui/res/cardsfolder
          sparse-checkout-cone-mode: false

      # ─── TODO: fetch data/synergy.db and data/tags.db here ──────
      # Example (option a — GitHub Release asset):
      #   - name: Download synergy.db
      #     env:
      #       GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     run: |
      #       gh release download data-latest \
      #         --pattern 'synergy.db' --dir data/
      #       gh release download data-latest \
      #         --pattern 'tags.db' --dir data/

      - name: Install deps
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: "3.13"
      - run: uv sync

      - name: Run integration tests
        run: uv run pytest tests/ -v -m integration --no-cov
