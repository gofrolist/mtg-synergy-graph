name: Publish mtg-synergy wheel

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs full history for version

      - uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uv build packages/mtg-synergy

      - name: Get version from wheel filename
        id: version
        run: |
          WHEEL=$(ls dist/*.whl)
          # Extract version from wheel filename: mtg_synergy-X.Y.Z-py3-none-any.whl
          VERSION=$(basename "$WHEEL" | sed 's/mtg_synergy-\(.*\)-py3-none-any.whl/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built version: $VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          SHA_SHORT="${SHA:0:7}"
          gh release create "$TAG" \
            dist/*.whl \
            --title "mtg-synergy ${VERSION}" \
            --notes "Built from ${SHA_SHORT}" \
            --latest
