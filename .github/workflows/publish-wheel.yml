name: Publish wheel

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # For wheel provenance attestation (attest-build-provenance).
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Read version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        run: uv build

      - name: Generate changelog
        # Version-pinned — same rationale as release.yml: contents:write
        # job must not execute whatever PyPI serves as "latest".
        run: uvx git-cliff==2.13.1 --latest --strip header -o RELEASE_NOTES.md

      - name: Attest wheel provenance
        # Lets consumers verify the wheel was built by this workflow
        # from the tagged source: `gh attestation verify <wheel> -R <repo>`.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: "dist/*.whl"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            dist/*.whl \
            --title "mtg-synergy-graph ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest
