name: Publish wheel

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # For wheel provenance attestation (attest-build-provenance).
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Read version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        run: uv build

      - name: Generate changelog
        # Version-pinned — same rationale as release.yml: contents:write
        # job must not execute whatever PyPI serves as "latest".
        run: uvx git-cliff==2.13.1 --latest --strip header -o RELEASE_NOTES.md

      - name: Attest wheel provenance
        # Lets consumers verify the wheel was built by this workflow
        # from the tagged source: `gh attestation verify <wheel> -R <repo>`.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            dist/*.whl \
            --title "mtg-synergy-graph ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest
