name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: uv version --bump "$BUMP" --no-sync

      - name: Update lockfile
        # uv.lock records the project's own version; CI enforces
        # `uv sync --locked`, so the bump must regenerate the lock or
        # the release PR fails its required checks (seen on v0.5.0).
        run: uv lock

      - name: Read version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Update changelog
        # Version-pinned: this job holds contents:write, so resolving
        # "latest from PyPI" at run time would hand that token to any
        # future compromised git-cliff release.
        run: uvx git-cliff==2.13.1 -o CHANGELOG.md

      - name: Create release PR with auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "chore: release v${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: release v${VERSION}" \
            --body "Automated release — bumps version to ${VERSION} and updates CHANGELOG.md." \
            --head "$BRANCH" \
            --base main
          gh pr merge "$BRANCH" --auto --squash
