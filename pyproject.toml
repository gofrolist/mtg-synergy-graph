[project]
name = "mtg-synergy-graph"
version = "0.1.0"
description = "MTG EDH/Commander deck synergy analysis using LLM tags and card embeddings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.4.3",
    "sentence-transformers>=5.3.0",
    "torch>=2.10.0",
    "unsloth>=2026.3",
    "bitsandbytes>=0.49",
    "trl>=0.24",
    "transformers>=5.2",
    "datasets>=4.3",
    "peft>=0.18",
    "accelerate>=1.13",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.setuptools]
py-modules = []
