[project]
name = "mtg-synergy-graph"
version = "0.1.0"
description = "MTG EDH/Commander deck synergy analysis using LLM tags and card embeddings"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.4.3",
    "sentence-transformers>=5.3.0",
    "torch>=2.10.0",
    "transformers>=5.2",
    "datasets>=4.3",
    "accelerate>=1.13",
    # GPU fine-tuning deps (Linux only — require CUDA/triton)
    "unsloth>=2026.3; sys_platform == 'linux'",
    "bitsandbytes>=0.49; sys_platform == 'linux'",
    "trl>=0.24; sys_platform == 'linux'",
    "peft>=0.18; sys_platform == 'linux'",
    "lightgbm>=4.6.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" },
]

[project.scripts]
mtg-synergy = "mtg_synergy.cli:run"

[tool.setuptools]
py-modules = []
