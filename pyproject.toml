[project]
name = "mtg-synergy-graph"
version = "0.1.0"
description = "Deterministic Forge-DSL graph engine for MTG EDH/Commander synergy"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
graph = ["numpy>=1.24"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "vulture>=2.16",
]
