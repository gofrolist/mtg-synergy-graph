[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[project]
name = "mtg-synergy-graph"
version = "0.1.0"
description = "MTG EDH/Commander deck synergy analysis using Forge mechanics and LightGBM LambdaRank"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.4.3",
    "lightgbm>=4.6.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "mtg_synergy"
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
mtg-synergy = "mtg_synergy.cli:run"
