[project]
name = "mtg-synergy-workspace"
version = "0.1.0"
description = "MTG EDH/Commander deck synergy analysis — workspace root"
requires-python = ">=3.12,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mtg-synergy = { workspace = true }
mtg-synergy-train = { workspace = true }
mtg-synergy-graph = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "vulture>=2.16",
    "mtg-synergy",
    "mtg-synergy-train",
    "mtg-synergy-graph",
]
