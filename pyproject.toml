[project]
name = "mtg-synergy-graph"
version = "0.2.0"
description = "Deterministic Forge-DSL graph engine for MTG EDH/Commander synergy"
requires-python = ">=3.13,<3.15"
dependencies = []

[project.optional-dependencies]
graph = ["numpy>=2.4"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "S101",  # allow assert in tests
    "S608",  # SQL injection — we use frozenset-guarded interpolation, not user input
    "S108",  # temp file usage is intentional in scripts
    "E501",  # line length handled by formatter
    "RUF002", # ambiguous unicode in strings (MTG card names use special chars)
    "RUF003", # ambiguous unicode in comments (math notation)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101"]

[dependency-groups]
dev = [
    "pre-commit>=4.5",
    "pytest>=9.0.3",
    "ruff>=0.15",
    "vulture>=2.16",
    "mtg-synergy-graph[graph]",
]
