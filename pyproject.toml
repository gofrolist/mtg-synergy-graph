[project]
name = "mtg-synergy-graph"
version = "0.4.0"
description = "Deterministic Forge-DSL graph engine for MTG EDH/Commander synergy"
requires-python = ">=3.13,<3.15"
dependencies = []

[project.optional-dependencies]
graph = ["numpy>=2.4.5"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
exclude = ["scripts/", "tests/"]
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests (marker `integration`) require the full synergy.db /
# Forge cardsfolder. They are excluded from the default run so CI — and
# any contributor without the data — gets a fast, green suite. Run
# explicitly with `uv run pytest -m integration` on a dev machine.
addopts = "-n=auto --cov=src/mtg_synergy_graph --cov-fail-under=80 -m 'not integration'"
# ResourceWarning is promoted to an error so any future sqlite3.Connection
# (or other resource) leak fails the test that produced it instead of
# silently emitting at GC time. Locks in the leak audit landed in
# commits 43df25c + d99462e (closes #56).
filterwarnings = [
    "error::ResourceWarning",
]
markers = [
    "integration: requires data/synergy.db or data/forge cardsfolder; excluded by default",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

# Mutation testing config. Scope is narrow (high-value scoring core) by
# design — full-suite mutation testing on 9.8k LOC would take days.
# Run with: `uv run mutmut run` (slow; expect ~hours).
# Inspect survivors with: `uv run mutmut results` then `uv run mutmut show <id>`.
[tool.mutmut]
# KNOWN-INCOMPLETE — mutmut 3.x is not currently runnable against this
# codebase. The blocker is mutmut's in-process pytest model: it invokes
# ``pytest.main()`` twice in the same Python process (once for coverage
# gathering, once for stats collection). The second call fails with
# ``ImportError: cannot load module more than once per process`` because
# our ``tests/conftest.py`` has module-level state that pytest cannot
# re-import.
#
# What's already wired up (preserved for a future fix attempt):
#  - ``conftest.py`` at repo root injects ``mutants/src/`` onto sys.path
#    so the mutated source supersedes the editable install. No-op for
#    normal pytest runs.
#  - ``also_copy`` brings the full package, test suite, fixtures, data
#    seeds, and supporting scripts into ``mutants/``.
#  - ``pytest_add_cli_args`` overrides the suite's xdist + --cov defaults,
#    which interact badly with mutmut's subprocess model.
#
# Recommended next steps (not in scope of this commit):
#  - Try ``cosmic-ray`` instead — patches in-place rather than copying,
#    uses subprocess pytest, sidesteps the re-import issue.
#  - Or: refactor ``tests/conftest.py`` to remove module-level state
#    that's incompatible with re-import (the embedding shim + sys.path
#    mutation in particular).
paths_to_mutate = [
    "src/mtg_synergy_graph/universal_scorer.py",
]
tests_dir = ["tests/"]
mutate_only_covered_lines = true
also_copy = [
    "tests/",
    "data/",
    "scripts/",
    "pyproject.toml",
    "src/mtg_synergy_graph/",
    "conftest.py",
]
pytest_add_cli_args = [
    "-o", "addopts=",
    "-p", "no:xdist",
    "-p", "no:randomly",
    "--no-cov",
    "-m", "not integration",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "S101",  # allow assert in tests
    "S108",  # temp file usage is intentional in scripts
    "E501",  # line length handled by formatter
    "RUF002", # ambiguous unicode in strings (MTG card names use special chars)
    "RUF003", # ambiguous unicode in comments (math notation)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101"]
# S608: all SQL uses ? placeholders; f-strings only interpolate placeholder counts
"src/mtg_synergy_graph/engine.py" = ["S608"]
"src/mtg_synergy_graph/graph_engine.py" = ["S608"]
"src/mtg_synergy_graph/graph_cache.py" = ["S608"]
"src/mtg_synergy_graph/importer.py" = ["S608"]
"src/mtg_synergy_graph/scoring.py" = ["S608"]
"src/mtg_synergy_graph/penalties.py" = ["S608"]
"src/mtg_synergy_graph/complement_rules/*.py" = ["S608"]
"src/mtg_synergy_graph/bench/optimize.py" = ["S608"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=6.1",
    "pytest-xdist>=3.6",
    "ruff>=0.15.16",
    "vulture>=2.16",
    "mtg-synergy-graph[graph]",
    "coverage>=7.14.0",
    "mutmut>=3.5",
]
