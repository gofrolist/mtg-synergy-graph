[project]
name = "mtg-synergy-graph"
version = "0.3.0"
description = "Deterministic Forge-DSL graph engine for MTG EDH/Commander synergy"
requires-python = ">=3.13,<3.15"
dependencies = []

[project.optional-dependencies]
graph = ["numpy>=2.4.5"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
exclude = ["scripts/", "tests/"]
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests (marker `integration`) require the full synergy.db /
# Forge cardsfolder. They are excluded from the default run so CI — and
# any contributor without the data — gets a fast, green suite. Run
# explicitly with `uv run pytest -m integration` on a dev machine.
addopts = "-n=auto --cov=src/mtg_synergy_graph --cov-fail-under=80 -m 'not integration'"
# ResourceWarning is promoted to an error so any future sqlite3.Connection
# (or other resource) leak fails the test that produced it instead of
# silently emitting at GC time. Locks in the leak audit landed in
# commits 43df25c + d99462e (closes #56).
filterwarnings = [
    "error::ResourceWarning",
]
markers = [
    "integration: requires data/synergy.db or data/forge cardsfolder; excluded by default",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "S101",  # allow assert in tests
    "S108",  # temp file usage is intentional in scripts
    "E501",  # line length handled by formatter
    "RUF002", # ambiguous unicode in strings (MTG card names use special chars)
    "RUF003", # ambiguous unicode in comments (math notation)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101"]
# S608: all SQL uses ? placeholders; f-strings only interpolate placeholder counts
"src/mtg_synergy_graph/engine.py" = ["S608"]
"src/mtg_synergy_graph/graph_engine.py" = ["S608"]
"src/mtg_synergy_graph/graph_cache.py" = ["S608"]
"src/mtg_synergy_graph/importer.py" = ["S608"]
"src/mtg_synergy_graph/scoring.py" = ["S608"]
"src/mtg_synergy_graph/penalties.py" = ["S608"]
"src/mtg_synergy_graph/complement_rules/*.py" = ["S608"]
"src/mtg_synergy_graph/bench/optimize.py" = ["S608"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=6.1",
    "pytest-xdist>=3.6",
    "ruff>=0.15.13",
    "vulture>=2.16",
    "mtg-synergy-graph[graph]",
    "coverage>=7.14.0",
]
