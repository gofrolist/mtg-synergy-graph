[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-synergy-train"
version = "0.1.0"
description = "MTG EDH/Commander synergy model training — data pipelines, causal graph, LightGBM training"
requires-python = ">=3.12"
dependencies = [
    "mtg-synergy>=0.1.0",
    "numpy>=2.0",
    "lightgbm>=4.0",
]

[project.scripts]
mtg-synergy = "mtg_synergy_train.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_synergy_train"]
