[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-synergy"
version = "0.1.0"
description = "MTG EDH/Commander card synergy inference library — Forge mechanics + LightGBM LambdaRank"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "lightgbm>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_synergy"]
